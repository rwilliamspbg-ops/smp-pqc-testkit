[workspace]
resolver = "2"
members = [
    "smp-pqc-core",
    "smp-pqc-cli",
    "smp-pqc-bench",
    "smp-pqc-network",
    "smp-pqc-inventory",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
# Verified locally (`cargo +1.88.0 build/test --workspace --all-targets
# --locked`) rather than bisected byte-for-byte; the floor is set by
# criterion 0.8's/time 0.3's own MSRV, not this workspace's code. Checked
# in CI (msrv job in ci.yml) so a dependency bump that raises the real
# floor gets caught instead of silently drifting past this number.
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/rwilliamspbg-ops/smp-pqc-testkit"
# Shared crates.io metadata. Individual crates that warrant more specific
# categories (e.g. smp-pqc-cli's "command-line-utilities") set their own
# `categories` literal instead of inheriting this one -- workspace field
# inheritance is all-or-nothing per field, not additive.
keywords = ["post-quantum", "cryptography", "pqc", "kyber", "dilithium"]
categories = ["cryptography"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# SLH-DSA's hash-tree computation is hash-bound and, unlike most crates, pays
# an enormous debug-build penalty: SLH-DSA-SHAKE-256s went from ~1.8s/sign in
# release to 2+ MINUTES/sign unoptimized. cargo test/build use the `dev`
# profile by default, so without this override the test suite would be
# unusable. Optimize dependency code while keeping our own crates' debug info
# and fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 3
