[workspace]
resolver = "2"
members = [
    "smp-pqc-core",
    "smp-pqc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/rwilliamspbg-ops/smp-pqc-testkit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
