[package]
name = "smp-pqc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust abstractions over NIST PQC algorithms (ML-KEM, ML-DSA, SLH-DSA) and classical/PQC hybrids"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "smp-pqc-core"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
rand = "0.8"
rand_core = "0.10.1"
serde.workspace = true
# Pinned: slh-dsa 0.1.0 breaks against signature >=2.3.0-pre.5 (that release
# bumped its rand_core requirement to 0.9, which removed CryptoRngCore that
# slh-dsa's code still calls). Keep this pin until slh-dsa publishes a fix.
serde_json.workspace = true
signature = "=2.3.0-pre.4"
slh-dsa = "0.1.0"
thiserror.workspace = true
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets"] }

[dev-dependencies]
dudect-bencher = "0.7.0"
hex = "0.4"
proptest = "1.11.0"
rand = "0.8"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "dudect_ml_kem_decap"
path = "examples/dudect_ml_kem_decap.rs"

[[example]]
name = "mohawk_nexus_integration"
path = "examples/mohawk_nexus_integration.rs"