name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  cargo-deny:
    name: cargo-deny (advisories/licenses/bans/sources) (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV (rustc 1.88.0, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  coverage:
    name: code coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # Two separate invocations, not one combined `-p core -p cli`: the
      # crates are at different coverage levels (core's algorithm logic is
      # ~95%+; cli's remaining gaps are SSH/QUIC's "server negotiated
      # successfully but not PQC" branches, which need a local test server
      # neither protocol has yet -- see docs/threat-model.md). A single
      # combined threshold would either fail permanently on cli's real
      # number or silently mask core regressions behind cli's slack.
      # Thresholds below are set at/near the current measured floor
      # (verified locally before this change) so they catch real
      # regressions without being aspirational numbers nobody enforces.
      - name: Coverage - smp-pqc-core (floor 90% lines / 90% functions)
        run: |
          cargo llvm-cov -p smp-pqc-core --lib --tests --locked --lcov --output-path lcov-core.info
          cargo llvm-cov -p smp-pqc-core --lib --tests --locked --summary-only \
            --fail-under-lines 90 --fail-under-functions 90
      - name: Coverage - smp-pqc-cli (floor 90% lines / 80% functions)
        run: |
          cargo llvm-cov -p smp-pqc-cli --bins --tests --locked --lcov --output-path lcov-cli.info
          cargo llvm-cov -p smp-pqc-cli --bins --tests --locked --summary-only \
            --fail-under-lines 90 --fail-under-functions 80
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov-core.info,lcov-cli.info
          flags: unittests
          fail_ci_if_error: false

  fmt-clippy:
    name: fmt + clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  lean-verify:
    name: Lean formal verification (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake build
        working-directory: smp-pqc-verify

  # Catches crates.io metadata/packaging regressions (missing description,
  # a file reference escaping the crate directory, etc.) on every push,
  # separately from actually publishing anything. Only the three crates
  # with no path dependencies on each other can be checked this way --
  # smp-pqc-cli depends on them via path+version, and cargo's packaging
  # verification build resolves that version from the *registry*, which
  # doesn't have anything published yet on a fresh checkout. That's a
  # real chicken-and-egg constraint of multi-crate workspace publishing,
  # not a gap in this check; see .github/workflows/publish.yml.
  package-check:
    name: crates.io packaging check (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p smp-pqc-core --locked
      - run: cargo package -p smp-pqc-network --locked
      - run: cargo package -p smp-pqc-inventory --locked

  # cargo-fuzz needs nightly + libFuzzer/ASan, which aren't usable on the
  # windows-msvc target -- Linux-only, and deliberately not part of the
  # build-test matrix above.
  fuzz-smoke-test:
    name: fuzz smoke test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build parse_algorithm_names
        working-directory: smp-pqc-core
      - run: cargo fuzz run parse_algorithm_names -- -max_total_time=30
        working-directory: smp-pqc-core
